<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="17%" stop-color="#f97316" />
      <stop offset="34%" stop-color="#eab308" />
      <stop offset="51%" stop-color="#22c55e" />
      <stop offset="68%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(12px) scale(1.04); }
        100% { transform: translateY(0px) scale(1); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 0; opacity: 0.4; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: -120; opacity: 0.4; }
      }
      @keyframes hueRotate {
        0% { filter: hue-rotate(0deg); }
        50% { filter: hue-rotate(30deg); }
        100% { filter: hue-rotate(0deg); }
      }
      .animated-orb1 {
        animation: float1 10s ease-in-out infinite;
      }
      .animated-orb2 {
        animation: float2 12s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: pulseBeam 5s linear infinite;
      }
      .color-wheel {
        animation: hueRotate 14s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="animated-orb1">
    <circle cx="180" cy="110" r="140" fill="url(#orbGrad1)" />
  </g>
  <g class="animated-orb2">
    <circle cx="1030" cy="280" r="160" fill="url(#orbGrad2)" />
  </g>

  <!-- Ambient Dynamic Geometry & Curves (Behind foreground) -->
  <path class="flow-line" d="M 50 350 Q 300 280, 600 360 T 1150 320" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
  <path class="flow-line" d="M 80 80 Q 400 140, 750 60 T 1120 110" fill="none" stroke="url(#spectrumGrad)" stroke-width="1.8" opacity="0.6" />

  <!-- Aperture / Profiling Target Motif Graphic (Right side, non-intrusive) -->
  <g transform="translate(940, 190)" class="color-wheel" opacity="0.85">
    <!-- Camera Sensor Target Rings -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#spectrumGrad)" stroke-width="4" filter="url(#glow)" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    
    <!-- Crosshairs -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Color Checker Mini Patches inside motif -->
    <rect x="-70" y="-70" width="16" height="16" rx="3" fill="#ea580c" />
    <rect x="-48" y="-70" width="16" height="16" rx="3" fill="#0284c7" />
    <rect x="-70" y="-48" width="16" height="16" rx="3" fill="#16a34a" />
    <rect x="-48" y="-48" width="16" height="16" rx="3" fill="#eab308" />
  </g>

  <!-- FOREGROUND: Clean, Unobstructed Title & Subtitle Block -->
  <g transform="translate(80, 0)">
    
    <!-- Category Pill Badge -->
    <g transform="translate(0, 70)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8" />
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.5">CAMERA PROFILING &amp; CALIBRATION</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      Awesome Camera Profile Editing
    </text>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Ecosystem for ICC, DCP Generation, LUTs &amp; Color Science
    </text>

    <!-- Spectrum Line Divider -->
    <rect x="0" y="222" width="580" height="3" rx="1.5" fill="url(#spectrumGrad)" />

    <!-- Feature Attribute Badges -->
    <g transform="translate(0, 250)">
      <!-- Badge 1: ICC & DCP -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🎯 ICC &amp; DCP</text>

      <!-- Badge 2: 3D LUTs -->
      <rect x="142" y="0" width="115" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="156" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🎨 3D LUTs</text>

      <!-- Badge 3: ACES & CMS -->
      <rect x="269" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="283" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">⚡ ACES Pipeline</text>

      <!-- Badge 4: Open Source -->
      <rect x="416" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="430" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🚀 Open Source</text>
    </g>

    <text x="0" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Professional color science tools, camera characterization software, and colorimeter pipelines.
    </text>
  </g>
</svg>
